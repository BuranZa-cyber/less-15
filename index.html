<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Lab</title>
  <style>
    :root{
      --bg:#f7f7ff;
      --paper:#ffffff;
      --ink:#28234f;
      --line:#e5e3f4;
      --blue:#4b7bf8;
      --violet:#7f5cf4;
      --green:#41c58c;
      --yellow:#ffd73d;
      --pink:#f26ca8;
      --orange:#ff9b45;
      --shadow:0 20px 46px rgba(45,35,120,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:radial-gradient(circle at 12% 8%, rgba(255,215,61,.18), transparent 20rem), radial-gradient(circle at 90% 12%, rgba(242,108,168,.12), transparent 22rem), var(--bg); font-family:Inter,system-ui,Segoe UI,Arial,sans-serif; color:var(--ink)}
    img{max-width:100%;display:block}
    button{font:inherit}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .page{width:min(1140px, calc(100% - 28px)); margin:0 auto; padding:18px 0 42px}
    .shell{display:grid; gap:18px}
    .hero{background:linear-gradient(135deg,#2f2977,#5b44d8); border-radius:28px; padding:14px; box-shadow:var(--shadow)}
    .hero img{border-radius:20px; width:100%; height:auto}
    .panel{background:var(--paper); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:18px}
    .top-row{display:grid; grid-template-columns:1.05fr .95fr; gap:18px}
    .stack{display:grid; gap:18px}
    .mission-grid,.plan-grid{display:grid; gap:12px}
    .mission-grid{grid-template-columns:1fr 1fr}
    .plan-grid{grid-template-columns:1fr 1fr}
    .choice{position:relative; border:2px solid var(--line); background:#fff; border-radius:20px; padding:12px; cursor:pointer; transition:.18s ease; min-height:118px}
    .choice:hover{transform:translateY(-2px)}
    .choice.active{border-color:var(--violet); background:#f8f6ff; box-shadow:0 0 0 4px rgba(127,92,244,.10)}
    .choice .dot{position:absolute; top:10px; right:10px; width:16px; height:16px; border-radius:50%; border:2px solid #d9d5f8; background:#fff}
    .choice.active .dot{background:var(--violet); border-color:var(--violet)}
    .mini-pair{display:flex; gap:10px; justify-content:center; align-items:center; padding:8px 4px}
    .mini-grid{display:grid; gap:2px; background:#f2f1fb; border-radius:10px; padding:6px; border:1px solid #e5e3f4; box-shadow: inset 0 -2px rgba(33,26,91,.04)}
    .sq{width:12px; height:12px; border-radius:3px; background:#fff; border:1px solid rgba(115,101,190,.16)}
    .sq.fill-a{background:#65d5ff}
    .sq.fill-b{background:#ffd73d}
    .sq.border-a{box-shadow:inset 0 0 0 2px #4b7bf8}
    .sq.border-b{box-shadow:inset 0 0 0 2px #7f5cf4}
    .vs{display:grid; place-items:center; width:26px; height:26px; border-radius:999px; background:#f0edff; color:#7259e1; font-size:16px; font-weight:900}
    .builder{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr); gap:18px; align-items:start}
    .editor{border:1px solid var(--line); border-radius:20px; background:#fcfcff; padding:16px}
    .grid-wrap{overflow-x:auto; border-radius:18px; padding:12px; background:#f0effb}
    .pixel-grid{display:grid; gap:4px; width:max-content; margin:auto}
    .cell{width:clamp(28px,5vw,44px); height:clamp(28px,5vw,44px); border-radius:6px; border:1px solid #d9d7e9; background:#fff; cursor:pointer; box-shadow:inset 0 -2px rgba(32,27,80,.05); padding:0}
    .cell:hover{transform:scale(1.05); border-color:#6f61ce}
    .tool-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-top:14px}
    .palette{display:flex; flex-wrap:wrap; gap:10px}
    .sw{width:34px; height:34px; border-radius:12px; border:3px solid #fff; box-shadow:0 0 0 1px #dbd8ee; cursor:pointer}
    .sw.active{box-shadow:0 0 0 3px var(--ink)}
    .sw.eraser{display:grid; place-items:center; background:repeating-linear-gradient(45deg,#fff,#fff 5px,#eceaf8 5px,#eceaf8 10px); color:#605b82; font-size:16px}
    .icons{display:flex; gap:10px; flex-wrap:wrap}
    .icon-btn{width:46px; height:46px; border:0; border-radius:16px; background:#f1effb; display:grid; place-items:center; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .icon-btn.primary{background:var(--blue); color:#fff}
    .icon-btn.good{background:#e8fbf2; color:#16845d}
    .icon-btn:hover{transform:translateY(-1px)}
    .side{display:grid; gap:18px}
    .ideas img{border-radius:18px; border:1px solid var(--line)}
    .plan-card{display:grid; gap:12px}
    .toast{height:36px; display:grid; place-items:center; margin-top:12px}
    .toast .bubble{width:44px; height:44px; border-radius:999px; display:grid; place-items:center; font-size:22px; background:#fff; border:2px solid var(--line); opacity:0; transform:scale(.7); transition:.18s ease}
    .toast.show .bubble{opacity:1; transform:scale(1)}
    .toast.ok .bubble{border-color:#8de1bc; background:#effcf5}
    .toast.bad .bubble{border-color:#ffc8cf; background:#fff2f4}
    .selector-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
    .pair-strip{display:flex; gap:8px; flex-wrap:wrap}
    .pill{width:28px; height:28px; border-radius:999px; background:#f0edff; display:grid; place-items:center; color:#6b57d6; font-size:14px}
    .plan-box{border:1px solid var(--line); border-radius:18px; padding:12px; background:#fbfbff}
    .plan-box.active{border-color:var(--blue); box-shadow:0 0 0 4px rgba(75,123,248,.10)}
    .footer-space{height:4px}
    @media (max-width: 860px){
      .top-row, .builder{grid-template-columns:1fr}
    }
    @media (max-width: 620px){
      .mission-grid, .plan-grid{grid-template-columns:1fr}
      .page{width:min(100% - 16px, 1140px); padding-top:10px}
      .panel{padding:14px}
      .hero{padding:10px;border-radius:22px}
      .hero img{border-radius:16px}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <section class="hero panel" style="padding:14px; border:none; background:linear-gradient(135deg,#2f2977,#5b44d8)">
        <img src="assets/hero.png" alt="Пиксельные таблички на деревянном столе">
      </section>

      <div class="top-row">
        <section class="panel">
          <div class="selector-bar">
            <div class="pair-strip"><div class="pill">◻️</div><div class="pill">🟰</div><div class="pill">◻️</div></div>
            <div class="pair-strip"><div class="pill">🔷</div><div class="pill">🎯</div></div>
          </div>
          <div class="mission-grid" id="missionGrid"></div>
        </section>

        <section class="panel plan-card">
          <div class="selector-bar">
            <div class="pair-strip"><div class="pill">📐</div><div class="pill">✨</div></div>
            <div class="pair-strip"><div class="pill">🧩</div><div class="pill">🟪</div></div>
          </div>
          <div class="plan-grid" id="planGrid"></div>
        </section>
      </div>

      <section class="panel builder">
        <div class="editor">
          <div class="grid-wrap">
            <div class="pixel-grid" id="pixelGrid" aria-label="Пиксельная сетка"></div>
          </div>
          <div class="tool-row">
            <div class="palette" id="palette"></div>
            <div class="icons">
              <button class="icon-btn" id="clearBtn" type="button" aria-label="Очистить" title="Очистить">🧽</button>
              <button class="icon-btn" id="randomBtn" type="button" aria-label="Случайный узор" title="Случайный узор">✨</button>
              <button class="icon-btn good" id="checkBtn" type="button" aria-label="Проверить" title="Проверить">✅</button>
              <button class="icon-btn primary" id="downloadBtn" type="button" aria-label="Скачать" title="Скачать">⬇️</button>
            </div>
          </div>
          <div class="toast" id="toast"><div class="bubble" id="toastBubble">✅</div></div>
        </div>

        <aside class="side">
          <div class="plan-box" id="activePlanBox"></div>
          <div class="ideas">
            <img src="assets/icons.png" alt="Образцы пиксельных значков: робот, звезда, молния и геймпад">
          </div>
        </aside>
      </section>
      <div class="footer-space"></div>
    </div>
  </main>

  <script>
    const missions = {
      area: {
        plans:[{w:8,h:2,fill:'a',border:'a'},{w:4,h:4,fill:'a',border:'b'}],
        good:true
      },
      perimeter: {
        plans:[{w:5,h:2,fill:'b',border:'a'},{w:4,h:3,fill:'b',border:'a'}],
        good:true
      }
    };
    let currentMission='area';
    let currentPlan=0;
    let activeColor='#3478f6';
    const designs={};

    const iconPalette=['#ffffff','#29236f','#3478f6','#ffd02f','#f06aa8','#45bd91','#ff8a3d','#9a75e8'];
    const $=id=>document.getElementById(id);
    const key=()=>`${currentMission}-${currentPlan}`;
    const metrics=p=>({area:p.w*p.h, perimeter:2*(p.w+p.h)});

    function getDesign(){
      const plan=missions[currentMission].plans[currentPlan];
      const k=key();
      if(!designs[k]||designs[k].length!==plan.w*plan.h) designs[k]=Array(plan.w*plan.h).fill('#ffffff');
      return designs[k];
    }

    function makeMiniGrid(w,h,mode){
      const box=document.createElement('div');
      box.className='mini-grid';
      box.style.gridTemplateColumns=`repeat(${w}, 12px)`;
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const d=document.createElement('div');
          d.className='sq';
          if(mode.fill==='a') d.classList.add('fill-a');
          if(mode.fill==='b') d.classList.add('fill-b');
          if(x===0||y===0||x===w-1||y===h-1){
            if(mode.border==='a') d.classList.add('border-a');
            if(mode.border==='b') d.classList.add('border-b');
          }
          box.appendChild(d);
        }
      }
      return box;
    }

    function renderMissionButtons(){
      const wrap=$('missionGrid');
      wrap.innerHTML='';
      [
        {id:'area', left:{w:8,h:2,fill:'a',border:'a'}, right:{w:4,h:4,fill:'a',border:'b'}, icon:'🟦'},
        {id:'perimeter', left:{w:5,h:2,fill:'b',border:'a'}, right:{w:4,h:3,fill:'b',border:'a'}, icon:'🟨'}
      ].forEach(m=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='choice'+(currentMission===m.id?' active':'');
        b.setAttribute('aria-label', m.id==='area' ? 'Одинаковая площадь' : 'Одинаковый периметр');
        b.innerHTML='<span class="dot"></span>';
        const pair=document.createElement('div');
        pair.className='mini-pair';
        pair.appendChild(makeMiniGrid(m.left.w,m.left.h,m.left));
        const vs=document.createElement('div'); vs.className='vs'; vs.textContent='↔'; pair.appendChild(vs);
        pair.appendChild(makeMiniGrid(m.right.w,m.right.h,m.right));
        b.appendChild(pair);
        b.addEventListener('click',()=>{currentMission=m.id; currentPlan=0; renderAll(); pulse('✅','ok');});
        wrap.appendChild(b);
      });
    }

    function renderPlanButtons(){
      const wrap=$('planGrid');
      wrap.innerHTML='';
      missions[currentMission].plans.forEach((p,i)=>{
        const m=metrics(p);
        const b=document.createElement('button');
        b.type='button';
        b.className='choice'+(i===currentPlan?' active':'');
        b.setAttribute('aria-label', `План ${i+1}`);
        b.innerHTML='<span class="dot"></span>';
        const pair=document.createElement('div');
        pair.className='mini-pair';
        pair.appendChild(makeMiniGrid(p.w,p.h,p));
        const icons=document.createElement('div');
        icons.className='vs';
        icons.textContent=i===0?'◼':'◻';
        pair.appendChild(icons);
        b.appendChild(pair);
        wrap.appendChild(b);
        b.addEventListener('click',()=>{currentPlan=i; renderAll(); pulse('✨','ok');});
      });
    }

    function renderActivePlanBox(){
      const box=$('activePlanBox');
      const p=missions[currentMission].plans[currentPlan];
      const m=metrics(p);
      box.innerHTML='';
      const top=document.createElement('div');
      top.className='mini-pair';
      top.style.justifyContent='space-between';
      const left=document.createElement('div');
      left.className='pill'; left.textContent=currentMission==='area'?'⬛':'🔲';
      const right=document.createElement('div');
      right.className='pair-strip';
      [m.area,m.perimeter].forEach(num=>{
        const e=document.createElement('div');
        e.className='pill';
        e.textContent=num;
        right.appendChild(e);
      });
      top.appendChild(left); top.appendChild(right); box.appendChild(top);
      const preview=document.createElement('div'); preview.className='mini-pair';
      preview.appendChild(makeMiniGrid(p.w,p.h,p));
      box.appendChild(preview);
    }

    function renderGrid(){
      const grid=$('pixelGrid');
      const p=missions[currentMission].plans[currentPlan];
      const data=getDesign();
      grid.style.gridTemplateColumns=`repeat(${p.w}, minmax(0,1fr))`;
      grid.innerHTML='';
      data.forEach((color,idx)=>{
        const c=document.createElement('button');
        c.type='button';
        c.className='cell';
        c.style.background=color;
        c.setAttribute('aria-label', `Клетка ${idx+1}`);
        c.addEventListener('click',()=>{data[idx]=activeColor; c.style.background=activeColor;});
        grid.appendChild(c);
      });
    }

    function renderPalette(){
      const wrap=$('palette');
      wrap.innerHTML='';
      iconPalette.forEach((color,i)=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='sw'+(color===activeColor?' active':'');
        b.style.background=color;
        if(color==='#ffffff') b.setAttribute('aria-label','Белый');
        b.addEventListener('click',()=>{activeColor=color; renderPalette();});
        wrap.appendChild(b);
      });
      const er=document.createElement('button');
      er.type='button';
      er.className='sw eraser'+(activeColor==='#ffffff'?' active':'');
      er.textContent='⌫';
      er.setAttribute('aria-label','Ластик');
      er.addEventListener('click',()=>{activeColor='#ffffff'; renderPalette();});
      wrap.appendChild(er);
    }

    function renderAll(){
      renderMissionButtons();
      renderPlanButtons();
      renderActivePlanBox();
      renderPalette();
      renderGrid();
    }

    function pulse(symbol,state){
      const t=$('toast'), b=$('toastBubble');
      b.textContent=symbol; t.className='toast show '+state;
      clearTimeout(window.toastTimer);
      window.toastTimer=setTimeout(()=>t.className='toast', 900);
    }

    $('clearBtn').addEventListener('click',()=>{
      const d=getDesign(); d.fill('#ffffff'); renderGrid(); pulse('🧽','ok');
    });
    $('randomBtn').addEventListener('click',()=>{
      const d=getDesign();
      d.forEach((_,i)=>d[i]=(Math.random()>.42? iconPalette[Math.floor(Math.random()*(iconPalette.length-1))+1] : '#ffffff'));
      renderGrid(); pulse('✨','ok');
    });
    $('checkBtn').addEventListener('click',()=>{
      const pair=missions[currentMission].plans.map(metrics);
      const ok=currentMission==='area'
        ? pair[0].area===pair[1].area && pair[0].perimeter!==pair[1].perimeter
        : pair[0].perimeter===pair[1].perimeter && pair[0].area!==pair[1].area;
      pulse(ok?'✅':'🔁', ok?'ok':'bad');
    });
    $('downloadBtn').addEventListener('click',()=>{
      const p=missions[currentMission].plans[currentPlan];
      const d=getDesign();
      const cell=72,gap=6,pad=26;
      const w=pad*2 + p.w*cell + (p.w-1)*gap;
      const h=pad*2 + p.h*cell + (p.h-1)*gap;
      const canvas=document.createElement('canvas');
      canvas.width=w*2; canvas.height=h*2;
      const ctx=canvas.getContext('2d'); ctx.scale(2,2);
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
      d.forEach((color,i)=>{
        const x=i%p.w, y=Math.floor(i/p.w);
        const px=pad+x*(cell+gap), py=pad+y*(cell+gap);
        ctx.fillStyle=color; ctx.fillRect(px,py,cell,cell);
        ctx.strokeStyle='#d9d7e9'; ctx.lineWidth=1.5; ctx.strokeRect(px,py,cell,cell);
      });
      const a=document.createElement('a'); a.download='pixel-lab.png'; a.href=canvas.toDataURL('image/png'); a.click();
      pulse('⬇️','ok');
    });

    renderAll();
  </script>
</body>
</html>
